name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v9
        with:
          python-version: "3.12"

      - name: Install dependencies (incl. dev)
        run: uv sync --extra dev

      - name: Run the quality gate
        run: make check

      # Add postgres and redis service containers here when the
      # integration tests (testcontainers) arrive.
